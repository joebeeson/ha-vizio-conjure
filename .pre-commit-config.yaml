default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev ruff check custom_components tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --check custom_components tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pyrefly
        name: pyrefly
        entry: uv run --extra dev pyrefly check
        language: system
        types: [python]
        pass_filenames: false
