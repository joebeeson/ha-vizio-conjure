name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.2"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Verify manifest version matches tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/vizio_conjure/manifest.json"))["version"])')"
          test "$version" = "${TAG#v}"
      - run: >-
          uv run --no-project
          --with homeassistant==2026.10.2
          --with pytest
          --with pytest-cov
          --with "vizaio>=0.7,<0.8"
          pytest tests
      - run: uv run --extra dev ruff check custom_components tests
      - run: uv run --extra dev ruff format --check custom_components tests
      - name: Package HACS artifact
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p dist
          find custom_components -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -r "dist/vizio_conjure.zip" custom_components/vizio_conjure hacs.json README.md LICENSE
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
