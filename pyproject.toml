[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ha-vizio-conjure"
version = "0.1.0"
description = "Home Assistant integration scaffold for VIZIO Conjure"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Joe Beeson" }]

[project.optional-dependencies]
dev = [
  "homeassistant==2026.10.2; python_full_version >= '3.14.2'",
  "pyrefly>=1.4,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "pytest-datadir>=1,<2",
  "ruff>=0.8,<1",
  "vizaio>=0.7,<0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/vizio_conjure"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-excludes = []
disable-project-excludes-heuristics = true
search-path = ["custom_components"]
replace-imports-with-any = ["vizaio_conjure"]
project-includes = ["custom_components/**/*.py", "tests/**/*.py"]
